# .agent-loop.yml — per-repo config for the agent-loop autopilot.
version: 1

branch_base: main
max_rounds: 4

# FALSE, deliberately. The loop refuses to auto-merge unless the base branch has
# a required status check, and branch protection on a private repo needs GitHub
# Pro. Setting it true anyway would make every run end in a human flag that looks
# like a failure. The loop stops at "ready to merge" and the founder merges.
# Flip to true the day this repo is public or the account is upgraded.
auto_merge: false
merge_method: squash

# Agora has no third-party runtime dependencies and is not packaged, so there is
# nothing to install but the test runner itself.
commands:
  install: "python -m pip install pytest"
  test:    "python -m pytest"
  lint:    ""      # none configured; the DoD rubric decides, not a linter
  build:   ""      # nothing to build — one package, one HTML file, one hook

# Every hard-stop below names the invariant it protects. A stop that cannot name
# one does not belong here: it fires on every change of a shape rather than on a
# change that can actually do harm, and a stop that fires every time is a stop
# nobody reads.
hard_stops:
  # Agora declares no runtime dependencies and that is a property worth keeping —
  # it is the reason the app cannot be broken by an SDK major. A change here is a
  # change to that promise.
  dependency_files:
    - pyproject.toml
    - requirements*.txt

  protected_paths:
    # This file, listed in itself. Today it is already unreachable without a
    # human — auto_merge is false, so every change stops in front of the founder
    # — which makes the stop redundant. It is listed anyway because redundant is
    # a property of the current config, not of the file: a protection that
    # depends on a flag staying false is not a protection. The stop fires only on
    # an agent's branch, so it costs a human nothing.
    - ".agent-loop.yml"

    # The other path, and it earns it: a SessionStart hook runs inside every Claude
    # Code session on this machine. A hook that throws or hangs damages sessions
    # that have nothing to do with Agora, and it fails silently by design, so
    # nothing here surfaces the damage. No test can cover that blast radius.
    - "hooks/agora_hook.py"

    # DELIBERATELY NOT LISTED, and why — because a stop that fires on every
    # change is a stop nobody reads, and the first two issues filed against this
    # repo both tripped one:
    #
    #   static/index.html — the UI is where nearly all the work is. It is covered
    #     by tests/test_ui.py at the seams a browser hides (dead URLs, unknown
    #     admin actions, missing element ids) plus the reviewer. Protecting it
    #     meant no UI issue could ever run.
    #
    #   agora/mcp.py — the real invariant is not "this file changed", it is
    #     "TOOLS gained an entry", because a tool added to a running server is
    #     invisible to every session already connected. That is a semantic check,
    #     so it belongs to the reviewer below, not to a path glob.
    #
    #   **/summons* — reachability has been wrong three times, always the same
    #     way. The invariant is "a control must not report success while reaching
    #     nothing", which is now covered by tests and stated in the reviewer
    #     instructions. A file glob was a proxy for it, and a bad one.

  flag_on_file_delete: true
  flag_on_public_api_change: true

review:
  # This said `CLAUDE.md`, a file this repo has never had, so the reviewer read
  # one source short and nothing said so — the same defect this repo keeps
  # shipping, a declaration reporting coverage it does not have. context.md is
  # the file that line meant; it is named first rather than left to the
  # directory below it because it carries the non-negotiable invariants and a
  # source that important should be named, not swept up by a glob.
  # tests/test_agent_loop_config.py fails if a path here stops existing.
  # DECISIONS.md is named too, and separately from the directory: it lives at
  # docs/, not docs/agents/, so the glob below does not reach it. A ledger the
  # reviewer cannot read is a ledger that decides nothing.
  standards_sources:
    - docs/agents/context.md
    - docs/DECISIONS.md
    - docs/agents/

  # Semantic hard-stops. These are invariants a path glob cannot express, and
  # they are the reason the protected_paths list above is two lines long, one
  # of which is this file.
  #
  # Each now cites its row in docs/DECISIONS.md, and the full text STAYS HERE
  # rather than collapsing to "see D3". No agent-loop plugin file reads this key
  # at all: it is honoured only because the orchestrating session reads this
  # config and pastes these strings verbatim into the reviewer's prompt. A bare
  # citation would hand the reviewer a pointer it cannot follow and would
  # silently weaken the four stops this repo most depends on — which is this
  # repo's own recurring defect, a declaration reporting coverage it does not
  # have. The number is for humans and issues; the text is what actually runs.
  hard_stop_when:
    - "A new entry is added to TOOLS in agora/mcp.py. A client fetches tools/list
       once at connect, so a new tool is invisible to every session already
       connected — it ships as a no-op for exactly the sessions that needed it,
       and every session must restart. Adding an ARGUMENT to an existing tool is
       fine and is the correct way to extend. (D1)"
    - "A third-party import appears anywhere in agora/ or hooks/. Zero runtime
       dependencies is why the MCP layer is hand-rolled and why the app cannot be
       broken by an SDK major. (D2)"
    - "A control gains a success path that does not distinguish 'it worked' from
       'it reached nobody'. This app has shipped that defect three times on three
       surfaces; it is the one bug class to refuse outright. (D3)"
    - "The server binds anywhere other than 127.0.0.1, or authentication is added
       or removed. The loopback bind is the security boundary. (D4)"
