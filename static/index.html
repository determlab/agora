<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agora</title>
<style>
:root{
  --bg:#0d1013; --panel:#14181c; --panel2:#1b2126; --line:#252d33; --line2:#333d45;
  --ink:#e7ecea; --ink2:#9fadb5; --mut:#6b7880;
  --acc:#d9a051; --acc-ink:#0d1013; --acc-bg:#2b2110;
  --go:#5cc298; --warn:#e0b341; --stop:#ec7364; --human:#7aa7ff;
  --mono:"Cascadia Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:6px; --shadow:0 2px 6px rgba(0,0,0,.35), 0 8px 28px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:light){
  :root{--bg:#edefed;--panel:#fcfdfc;--panel2:#e8ece9;--line:#d6ddd8;--line2:#c2ccc5;
        --ink:#14181a;--ink2:#454e53;--mut:#77838a;
        --acc:#8a5610;--acc-ink:#fff;--acc-bg:#f4eade;
        --go:#1a6a4b;--warn:#8a6410;--stop:#9c3126;--human:#2b5fbe;
        --shadow:0 1px 3px rgba(20,24,26,.09), 0 8px 24px rgba(20,24,26,.08);}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 10px;cursor:pointer;transition:border-color .12s,background .12s}
button:hover:not(:disabled){border-color:var(--line2)}
button:focus-visible,input:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.p:hover:not(:disabled){filter:brightness(1.08)}
button.ghost{background:none;border-color:transparent;color:var(--ink2)}
button.ghost:hover:not(:disabled){background:var(--panel2);border-color:var(--line)}
button.danger{color:var(--stop)}
button:disabled{opacity:.38;cursor:not-allowed}
button.sm{padding:2px 8px;font-size:12px}
input,textarea{background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
::placeholder{color:var(--mut)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 284px;height:100vh}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.scroll{overflow-y:auto;min-height:0;scrollbar-width:thin}
h2{margin:0;padding:15px 14px 6px;flex:none;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  font-weight:600;display:flex;align-items:center;gap:6px}
h2 .n{background:var(--panel2);border-radius:9px;padding:0 6px;letter-spacing:0}
.pad{flex:none;padding:8px 14px 14px}
.empty{color:var(--mut);font-size:12.5px;padding:4px 14px 14px;line-height:1.5}
.empty b{color:var(--ink2);font-weight:600}

/* ---------- rooms ---------- */
#rooms{flex:0 1 auto;max-height:40vh}
#roster{flex:1 1 auto}
.item{padding:8px 14px;cursor:pointer;border-left:2px solid transparent;
  display:flex;gap:8px;align-items:center}
.item:hover{background:var(--panel2)}
.item[aria-selected="true"]{border-left-color:var(--acc);background:var(--acc-bg)}
.item .grow{min-width:0;flex:1}
.item .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.item .s{font-size:11px;color:var(--mut);font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:9px;
  font-size:10px;font-weight:700;padding:1px 6px;font-family:var(--mono);flex:none}
.fold{font-family:var(--mono);font-size:11px;color:var(--mut);cursor:pointer;
  padding:4px 14px 8px;user-select:none}
.fold:hover{color:var(--acc)}

/* ---------- presence ---------- */
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
/* On the roster the dot means reachable, not alive: a busy session hears a call
   at the end of its turn, an idle one hears nothing at all. `live` is the room's
   plain presence dot, which is a different question. */
.dot.busy{background:var(--go)} .dot.idle{background:var(--warn)}
.dot.live{background:var(--go)}
.dot.off{background:var(--mut);opacity:.35}
/* Reachable — its hook is parked — but known only by that hook, so the ring
   without the fill: the same green, minus what the registry would have told us. */
.dot.hooked{background:none;box-shadow:inset 0 0 0 1.5px var(--go)}
.tag{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:3px;
  background:var(--panel2);color:var(--mut);border:1px solid var(--line);
  white-space:nowrap}
.tag.go{color:var(--go);border-color:var(--go)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.stop{color:var(--stop);border-color:var(--stop)}

/* ---------- centre ---------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
header{flex:none;padding:11px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);display:flex;gap:12px;align-items:center}
header .ttl{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
header .ag{color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:text}
header .ag:hover{color:var(--acc)}
header .ag:empty::before{content:"add an agenda";color:var(--mut);font-style:italic}
#log{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;
  flex-direction:column;gap:2px;scrollbar-width:thin}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;
  padding:4px 0;align-items:start}
.msg.cont{padding-top:0}
.msg.cont .av{visibility:hidden;height:0}
.av{width:28px;height:28px;border-radius:var(--r);background:var(--panel2);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;
  font-weight:700;color:var(--acc);border:1px solid var(--line)}
.msg.human .av{color:var(--human);border-color:color-mix(in srgb,var(--human) 45%,transparent)}
.who{font-weight:600;font-size:12.5px;margin-bottom:1px}
.who time{font-weight:400;color:var(--mut);font-size:11px;font-family:var(--mono);
  margin-left:8px}
.who .role{color:var(--mut);font-weight:400;font-size:11px;margin-left:6px}
.bd{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
/* A mention of somebody else is a marker; a mention of you is addressed to you,
   so it is filled in rather than tinted. */
.mention{color:var(--acc);background:var(--acc-bg);border-radius:3px;
  padding:0 3px;font-weight:600}
.mention.me{background:var(--acc);color:var(--acc-ink)}
.sys{color:var(--mut);font-size:11.5px;font-family:var(--mono);text-align:center;
  padding:5px 0}
.card{border:1px solid var(--acc);background:var(--acc-bg);border-radius:var(--r);
  padding:12px 14px;margin:6px 0}
.card .who{color:var(--acc)}
.daysep{display:flex;align-items:center;gap:10px;color:var(--mut);
  font-family:var(--mono);font-size:10.5px;margin:10px 0 4px}
.daysep::before,.daysep::after{content:"";height:1px;background:var(--line);flex:1}
footer{flex:none;border-top:1px solid var(--line);padding:11px 18px;
  background:var(--panel);display:flex;gap:9px;align-items:flex-end;
  position:relative}
.mentions{position:absolute;left:18px;bottom:100%;z-index:20;min-width:210px;
  max-height:186px;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line2);border-radius:var(--r);padding:4px;
  box-shadow:var(--shadow);scrollbar-width:thin}
.mentions .opt{display:flex;gap:8px;align-items:center;padding:5px 9px;
  border-radius:4px;cursor:pointer;font-size:12.5px}
.mentions .opt .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mentions .opt .s{color:var(--mut);font-family:var(--mono);font-size:10.5px}
.mentions .opt[aria-selected="true"]{background:var(--acc-bg);color:var(--acc)}
#say{resize:none;min-height:44px;max-height:180px}
.hint{font-size:11px;color:var(--mut);font-family:var(--mono);
  padding:0 18px 8px;background:var(--panel);flex:none}

/* ---------- right pane ---------- */
.person{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12.5px}
.person:hover{background:var(--panel2)}
.person .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.person .acts{display:flex;gap:4px;flex:none}
.person .acts .kick{opacity:0}
.person:hover .acts .kick,.person:focus-within .acts .kick{opacity:1}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;margin-bottom:7px;font-size:12.5px}
.note b{color:var(--acc);font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{font-size:12px;padding:5px 6px}

/* ---------- identity ---------- */
.me{flex:none;border-top:1px solid var(--line);padding:10px 14px;
  display:flex;gap:8px;align-items:center}
.me .grow{flex:1;min-width:0}
.me .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut)}
.me strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The build the chair is actually looking at. Development happens inside a
   meeting held in this page, so "which version is this" has to be answerable
   without leaving the browser — small enough to ignore, present enough to read
   out when behaviour changes under someone mid-meeting. */
.ver{font-family:var(--mono);font-size:9.5px;color:var(--mut);flex:none;
  align-self:flex-end;letter-spacing:.04em}

/* An unreadable session registry is not an empty one. This says which. */
.alert{margin:0 14px 10px;padding:8px 10px;border-radius:7px;font-size:12px;
  line-height:1.45;color:var(--warn);border:1px solid var(--warn)}
.alert b{display:block;margin-bottom:2px}

/* ---------- modal + toast ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;
  place-items:center;padding:20px;z-index:40;animation:fade .12s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow)}
.modal.wide{max-width:680px}
.modal h3{margin:0 0 5px;font-size:17px}
.modal p.sub{color:var(--ink2);font-size:13px;margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--mono);font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.field .help{font-size:11.5px;color:var(--mut);margin-top:4px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;
  word-break:break-word;margin:0;max-height:220px;overflow-y:auto}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:10px 14px;max-width:520px;box-shadow:var(--shadow);font-size:13px;
  animation:rise .16s ease-out;pointer-events:auto}
.toast.bad{border-color:var(--stop)}
.toast.good{border-color:var(--go)}
.toast b{display:block;margin-bottom:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- connection ---------- */
#conn{flex:none;font-family:var(--mono);font-size:11px;padding:6px 14px;
  background:var(--stop);color:#fff;text-align:center;display:none}
#conn.show{display:block}

/* A pane toggle is an escape hatch for the widths that hide its pane; where the
   pane is already on screen the button is noise. */
#btnMeetings{display:none}

@media (max-width:1080px){
  .app{grid-template-columns:210px minmax(0,1fr)}
  .pane.right{display:none}
  .pane.right.open{display:flex;position:fixed;right:0;top:0;bottom:0;width:290px;
    z-index:30;box-shadow:var(--shadow)}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .pane.left{display:none}
  .pane.left.open{display:flex;position:fixed;left:0;top:0;bottom:0;width:260px;
    z-index:30;box-shadow:var(--shadow)}
  #btnMeetings{display:block}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="conn">Disconnected from Agora — retrying…</div>
<div class="app">

  <!-- ================= left ================= -->
  <aside class="pane left" id="paneLeft">
    <h2>Meetings <span class="n" id="nRooms">0</span></h2>
    <div id="rooms" class="scroll" role="listbox" aria-label="Meetings"></div>
    <div class="pad"><button class="p" style="width:100%" onclick="openNewRoom()">
      New meeting</button></div>

    <h2>Sessions <span class="n" id="nSessions">0</span></h2>
    <div id="roster" class="scroll" aria-label="Live sessions"></div>

    <div class="me">
      <span class="av" id="meAv">?</span>
      <span class="grow"><span class="lbl">You are</span><strong id="meName"></strong></span>
      <button class="ghost sm" onclick="askName()" title="Change your display name">edit</button>
      <span class="ver" id="ver" title="The Agora server this page is talking to"></span>
    </div>
  </aside>

  <!-- ================= centre ================= -->
  <main>
    <header>
      <!-- Not gated on a room being open: switching meetings is exactly what
           this is for when none is. -->
      <button class="ghost sm pane-btn" id="btnMeetings"
              onclick="togglePane('left')">Meetings</button>
      <div style="min-width:0;flex:1">
        <div class="ttl" id="ttl">No meeting open</div>
        <div class="ag" id="ag" onclick="editAgenda()" title="Click to edit the agenda"></div>
      </div>
      <span class="tag" id="stat" hidden></span>
      <button class="ghost sm pane-btn" id="btnPeople" onclick="togglePane('right')" hidden>People</button>
      <button class="ghost sm" onclick="exportRoom()" id="btnExport" disabled>Export</button>
    </header>

    <div id="log" class="scroll" aria-live="polite"></div>

    <div class="hint" id="hint" hidden></div>
    <footer>
      <div class="mentions" id="mentionMenu" role="listbox"
           aria-label="Participants to mention" hidden></div>
      <textarea id="say" rows="1" disabled
        placeholder="Open a meeting to say something"
        oninput="onComposerInput(this)" onkeydown="onKey(event)"
        onblur="closeMentions()"></textarea>
      <button class="p" id="btnSend" onclick="send()" disabled>Send</button>
    </footer>
  </main>

  <!-- ================= right ================= -->
  <div class="pane right" id="paneRight">
    <h2>In the room <span class="n" id="nPeople">0</span></h2>
    <div id="people" class="scroll" style="flex:0 1 auto;max-height:34vh"></div>

    <h2>Chair controls</h2>
    <div class="pad grid">
      <button onclick="askSummary()" title="Ask a participant to write a summary">Ask summary</button>
      <button onclick="localDigest()" title="Counts only — never interprets">Local digest</button>
      <button onclick="pruneGhosts()" title="Drop seats not seen for 15 minutes">Prune ghosts</button>
      <button id="btnClose" onclick="toggleClosed()">Close</button>
      <button id="btnArchive" onclick="toggleArchived()">Archive</button>
      <button class="danger" onclick="deleteRoom()">Delete</button>
    </div>

    <h2>Notes <span class="n" id="nNotes">0</span></h2>
    <div class="pad">
      <div id="notes"></div>
      <input id="noteBox" placeholder="A decision, an action item…"
             onkeydown="if(event.key==='Enter')addNote()">
    </div>

    <h2>Summaries <span class="n" id="nSums">0</span></h2>
    <div class="pad" id="sums"></div>
  </div>
</div>
<div id="toasts" aria-live="assertive"></div>

<script>
"use strict";
/* ============================ state ============================ */
let S = {rooms:[], roster:[], chair:"chair", url:"", version:"",
         discovery:{available:true, path:"", reason:"", note:""}};
let cur = null, snap = null, roomES = null, stateES = null;
let ME = "", seen = {}, unread = {};   // seen: messages already read per room

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => (String(n||"?").replace(/[^a-zA-Z0-9]+/g," ").trim()
  .split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()) || "?";
const clock = ts => new Date(ts*1000).toTimeString().slice(0,5);
const day = ts => new Date(ts*1000).toDateString();
const ago = n => n<60?`${n|0}s`:n<3600?`${Math.round(n/60)}m`:`${Math.round(n/3600)}h`;

const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem("agora."+k)) ?? d; }
             catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("agora."+k, JSON.stringify(v)); }catch(e){} },
};

/* ============================ transport ============================ */
async function api(path, opts){
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json().catch(()=>({})) : await r.text();
  if(!r.ok) throw new Error((body && body.error) || r.statusText || "request failed");
  return body;
}
const post = (p, b) => api(p, {method:"POST",
  headers:{"Content-Type":"application/json"}, body:JSON.stringify(b||{})});

function toast(msg, kind, title){
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.innerHTML = (title ? `<b>${esc(title)}</b>` : "") + esc(msg);
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "bad" ? 9000 : 4500);
}
const fail = err => toast(err.message || String(err), "bad", "That did not work");
const guard = fn => (...a) => { try { return fn(...a).catch(fail); }
                                catch(e){ fail(e); } };

/* ============================ identity ============================ */
function askName(){
  const v = prompt("Your name — this is how you appear in every meeting.",
                   ME === "chair" ? "" : ME);
  if(v === null) return false;
  const name = v.trim();
  if(!name) return false;
  ME = name; store.set("me", ME); paintMe();
  return true;
}
function paintMe(){ $("meName").textContent = ME; $("meAv").textContent = initials(ME); }
function ensureName(){ return (ME && ME !== "chair") ? true : askName(); }

/* ============================ live state ============================ */
function watchState(){
  if(stateES) stateES.close();
  stateES = new EventSource("/api/stream");
  stateES.addEventListener("state", e => {
    $("conn").classList.remove("show");
    S = JSON.parse(e.data);
    for(const r of S.rooms){
      if(r.id === cur){ seen[r.id] = r.messages; unread[r.id] = 0; continue; }
      if(seen[r.id] === undefined){ seen[r.id] = r.messages; continue; }
      unread[r.id] = Math.max(0, r.messages - seen[r.id]);
    }
    store.set("seen", seen);
    $("ver").textContent = S.version ? "v" + S.version : "";
    paintRooms(); paintRoster();
  });
  stateES.onopen = () => $("conn").classList.remove("show");
  stateES.onerror = () => {
    $("conn").classList.add("show");
    // EventSource retries on its own; this only covers a hard close.
    setTimeout(() => { if(stateES.readyState === 2) watchState(); }, 3000);
  };
}

/* ============================ rooms ============================ */
let showArchived = store.get("showArchived", false);

function roomItem(r){
  const n = unread[r.id] || 0;
  return `<div class="item" role="option" tabindex="0" aria-selected="${r.id===cur}"
      onclick="openRoom('${r.id}')" onkeydown="if(event.key==='Enter')openRoom('${r.id}')">
    <span class="grow">
      <span class="t">${esc(r.title)}</span>
      <span class="s">${r.participants} in · ${r.messages} msg${
        r.archived ? " · archived" : r.closed ? " · closed" : ""}</span>
    </span>
    ${n ? `<span class="badge">${n > 99 ? "99+" : n}</span>` : ""}
  </div>`;
}

function paintRooms(){
  const live = S.rooms.filter(r => !r.archived);
  const arch = S.rooms.filter(r => r.archived);
  $("nRooms").textContent = live.length;
  let html = live.length ? live.map(roomItem).join("")
    : `<div class="empty"><b>No meetings yet.</b><br>Create one, then Call a
       session into it from the list below.</div>`;
  if(arch.length){
    html += `<div class="fold" onclick="toggleArchive()">
      ${showArchived ? "▾" : "▸"} archived (${arch.length})</div>`;
    if(showArchived) html += arch.map(roomItem).join("");
  }
  $("rooms").innerHTML = html;
}
function toggleArchive(){ showArchived = !showArchived;
  store.set("showArchived", showArchived); paintRooms(); }

/* ============================ roster ============================ */
let showUnreachable = store.get("showUnreachable", false);

// A call is a post, and only something already in a tool loop can pick a post
// up. `now` is a measured wake path — a parked hook, or a parked room_wait — and
// works whatever the session is doing; `busy` means the call lands when the
// current turn ends. Anything else is a button that would do nothing.
const canCall = s => s.reach === "now" || s.liveness === "busy";
const listedFirst = s => canCall(s) || s.reach === "awaiting";

function sessionItem(s, here){
  // Known only because its hook registered: callable, but Claude Code's session
  // registry cannot be read from here, so version and busy/idle are genuinely
  // unknown — and the project too, but only when nothing sent a working
  // directory. The row says "unknown" rather than leaving them blank; blank
  // reads as "nothing there", which is a different and wrong answer.
  const only = s.source === "registration";
  const how = s.awaiting ? `woken ${ago(s.awaiting_age)} ago · not joined yet`
            : s.hooked ? (only ? "ready — hook only, not in the registry" : "ready")
            : s.in_lobby ? "waiting"
            : s.pending ? `called ${ago(s.queued_age)} ago`
            : s.liveness === "busy" ? "working — a call lands when it finishes"
            : s.liveness === "idle" ? "idle — type in its terminal to reach it"
            : "offline";
  const tip = s.reach === "awaiting"
      ? "It was woken and told the room. It joins when it finishes its current turn."
    : s.reach === "now" ? (only
      ? "Ready — its parked hook wakes it in about a second. It is not in Claude Code's session registry, so its version and whether it is mid-turn are unknown."
      : "Ready — wakes in about a second")
    : s.liveness === "busy"
      ? (s.pending ? "A call is waiting in the Lobby. It arrives when this session finishes its turn."
                   : "Working. A call is queued and arrives when it finishes its turn.")
    : s.liveness === "idle"
      ? "Idle: not in a tool loop, so a posted call cannot reach it. Type in that session's terminal, or restart it to pick up the Agora hook."
    : "Offline: no live session by this name, so there is nothing to call.";
  return `<div class="item" style="cursor:default">
    <span class="dot ${s.liveness === "offline" ? "off" : esc(s.liveness)}"></span>
    <span class="grow">
      <span class="t">${esc(s.name)}</span>
      <span class="s">${esc(s.provider)}${s.project ? " · " + esc(s.project)
        : only ? " · project unknown" : ""} · ${how}</span>
    </span>
    ${here ? `<span class="tag go">in room</span>`
      : s.reach === "awaiting" ? `<span class="tag warn" title="${tip}">joining…</span>`
      : !canCall(s)
        ? `<span class="tag ${s.liveness === "idle" ? "warn" : ""}"
             title="${tip}">${s.liveness === "idle" ? "idle" : "offline"}</span>`
        : `<button class="sm ${s.reach==='now'?'p':''}" title="${tip}"
             onclick="callIn('${esc(s.name)}')">Call</button>`}
  </div>`;
}

// Sessions nothing can reach are noise: the button would post into the Lobby and
// no one would read it. They collapse behind a fold that says what to do about
// them instead of offering a control that cannot work.
function paintRoster(){
  const reachable = S.roster.filter(listedFirst);
  const stuck = S.roster.filter(s => !listedFirst(s));
  $("nSessions").textContent = reachable.length;

  // "Nobody is running" and "I cannot see the registry" produce the same empty
  // list, and only one of them is about the sessions. The second is the normal
  // state in a container with nothing mounted, so it says so rather than
  // letting the chair read an empty roster as an answer.
  // Two separate facts, and the second is the one that bites: the directory can
  // be readable and still yield nothing, because the pids in it belong to a
  // machine this process cannot see. Both produce an empty list; neither means
  // "nobody is running", so the list does not get to imply it.
  const d = S.discovery || {available:true, note:""};
  const trouble = !d.available ? d.reason : d.note;
  let html = trouble ? `<div class="alert">
    <b>Session discovery is not working.</b>${esc(trouble)}
    ${d.path ? `<br>Looked in <code>${esc(d.path)}</code>.` : ""}</div>` : "";

  html += reachable.map(s => sessionItem(s, cur && s.rooms.includes(cur))).join("");
  if(!reachable.length && !trouble){
    html = `<div class="empty"><b>No session can be called right now.</b><br>
      A call is a post, so it only reaches a session that is working, or one
      parked on the Agora hook or in the Lobby. An idle session is reached by
      typing in its own terminal; restarting it once picks up the hook.</div>`;
  }
  if(stuck.length){
    html += `<div class="fold" onclick="toggleUnreachable()">
      ${showUnreachable ? "▾" : "▸"} ${stuck.length} cannot be called now</div>`;
    if(showUnreachable){
      html += stuck.map(s => sessionItem(s, cur && s.rooms.includes(cur))).join("");
    }
  }
  $("roster").innerHTML = html;
}
function toggleUnreachable(){ showUnreachable = !showUnreachable;
  store.set("showUnreachable", showUnreachable); paintRoster(); }

const callIn = guard(async who => {
  if(!cur) return toast("Open a meeting first.", "bad");
  const r = await post(`/api/rooms/${cur}/admin`, {action:"call", target:who, name:ME});
  if(r.woke) toast(`${who} was woken and told the room. It joins when it `
    + `finishes its current turn — the roster shows "joining…" until it does.`,
    "good", "Delivered");
  // Queued and waiting is a different outcome from queued and unread, and the
  // chair clicking again is what "both look the same" costs.
  else if(r.liveness === "busy") toast(r.note, null, "Queued, not delivered yet");
  else toast(r.note, "bad", "Nothing was reached");
});

/* ============================ one room ============================ */
function openRoom(id){
  cur = id; unread[id] = 0;
  closeMentions();   // the menu lists the room you were in a moment ago
  const row = S.rooms.find(r => r.id === id);
  if(row) seen[id] = row.messages;
  store.set("seen", seen);
  store.set("lastRoom", id);
  paintRooms();
  if(roomES) roomES.close();
  roomES = new EventSource(`/api/rooms/${id}/stream`);
  roomES.addEventListener("snapshot", e => { snap = JSON.parse(e.data); paintRoom(true); });
  roomES.addEventListener("append", e => {
    const d = JSON.parse(e.data);
    if(!snap) return;
    snap.events.push(...d.events);
    snap.participants = d.participants;
    snap.seq = d.seq; snap.closed = d.closed;
    paintRoom(false);
  });
}

function paintRoom(isSnapshot){
  if(!snap) return;
  $("ttl").textContent = snap.title;
  $("ag").textContent = snap.agenda || "";
  const st = $("stat");
  st.hidden = false;
  st.textContent = snap.archived ? "archived" : snap.closed ? "closed" : "live";
  st.className = "tag " + (snap.closed ? "stop" : "go");
  $("btnClose").textContent = snap.closed ? "Reopen" : "Close";
  $("btnArchive").textContent = snap.archived ? "Unarchive" : "Archive";
  $("btnExport").disabled = false;
  $("btnPeople").hidden = false;

  const composerOff = snap.closed;
  $("say").disabled = $("btnSend").disabled = composerOff;
  $("say").placeholder = composerOff
    ? "This meeting is closed. Reopen it to speak."
    : "Say something…   Enter to send · Shift+Enter for a newline";

  /* transcript */
  const log = $("log");
  const stick = isSnapshot ||
    (log.scrollTop + log.clientHeight >= log.scrollHeight - 80);
  let html = "", lastDay = "", prev = null;
  for(const e of snap.events){
    if(e.kind === "note") continue;
    const d = day(e.ts);
    if(d !== lastDay){ html += `<div class="daysep">${d}</div>`; lastDay = d; prev = null; }
    if(e.kind === "system"){ html += `<div class="sys">${esc(e.text)}</div>`; prev = null; continue; }
    if(e.kind === "summary"){
      html += `<div class="card"><div class="who">${esc(e.author)}
        <time>summary · ${clock(e.ts)}</time></div>
        <div class="bd">${esc(e.text)}</div></div>`;
      prev = null; continue;
    }
    // Group consecutive messages from the same author within five minutes.
    const cont = prev && prev.author === e.author && (e.ts - prev.ts) < 300;
    html += `<div class="msg ${e.role==='human'?'human':''} ${cont?'cont':''}">
      <div class="av">${initials(e.author)}</div>
      <div>${cont ? "" : `<div class="who">${esc(e.author)}<time>${clock(e.ts)}</time></div>`}
      <div class="bd">${withMentions(e)}</div></div></div>`;
    prev = e;
  }
  log.innerHTML = html || `<div class="empty" style="padding:24px 0;text-align:center">
    Nothing said yet. Call a session in from the left, then unmute it.</div>`;
  if(stick) log.scrollTop = log.scrollHeight;

  /* people */
  const ppl = snap.participants;
  $("nPeople").textContent = ppl.length;
  const muted = ppl.filter(p => p.muted && p.role !== "human").length;
  $("hint").hidden = muted === 0;
  $("hint").textContent = muted === 1
    ? "1 participant is muted and waiting for you to unmute it."
    : `${muted} participants are muted and waiting for you to unmute them.`;
  $("people").innerHTML = ppl.map(p => `
    <div class="person">
      <span class="dot ${p.online ? "live" : "off"}"></span>
      <span class="grow">${esc(p.name)}${
        p.role && p.role !== "agent" && p.role !== "human"
          ? `<span class="tag" style="margin-left:6px">${esc(p.role)}</span>` : ""}${
        p.muted && p.role !== "human"
          ? `<span class="tag warn" style="margin-left:6px"
               title="Present and reading, but its posts are refused until you unmute it.">muted</span>` : ""}</span>
      <span class="acts">${p.role === "human" ? "" : `
        <button class="sm ${p.muted ? "p" : "ghost"}"
          onclick="setMute('${esc(p.name)}',${!p.muted})">${p.muted ? "unmute" : "mute"}</button>
        <button class="sm ghost danger kick"
          onclick="kick('${esc(p.name)}')">kick</button>`}</span>
    </div>`).join("");

  /* notes + summaries */
  const notes = snap.events.filter(e => e.kind === "note");
  const sums  = snap.events.filter(e => e.kind === "summary");
  $("nNotes").textContent = notes.length;
  $("nSums").textContent = sums.length;
  $("notes").innerHTML = notes.map(n =>
    `<div class="note"><b>${esc(n.author)}</b><br>${esc(n.text)}</div>`).join("");
  $("sums").innerHTML = sums.length
    ? sums.map(s => `<div class="note"><b>${esc(s.author)} · ${clock(s.ts)}</b><br>${esc(s.text)}</div>`).join("")
    : `<div class="empty" style="padding:0">None yet. Ask a participant, or take a local digest.</div>`;
}

/* ============================ mentions ============================ */
const rxEsc = s => String(s).replace(/[.*+?^${}()|[\]\\-]/g, "\\$&");

/* Paints the mentions the SERVER resolved against the participant list. It never
   decides what a mention is: a pattern over somebody's words turns an address or
   a pasted snippet into a mention of a person who is not in the room. Escaping
   happens first, so the only markup here is the markup this function adds. */
function withMentions(e){
  let html = esc(e.text);
  for(const name of (e.mentions || [])){
    const mine = ME && name.toLowerCase() === String(ME).toLowerCase();
    // (?![\w-]) so a name that merely starts another one is left alone, the
    // same boundary the server matched with.
    const rx = new RegExp("@" + rxEsc(esc(name)) + "(?![\\w-])", "gi");
    html = html.replace(rx, () =>
      `<span class="mention${mine ? " me" : ""}">@${esc(name)}</span>`);
  }
  return html;
}

/* The completion menu. This regex runs only over the chair's own half-typed
   draft, to offer names — what actually counts as a mention is decided server
   side, after the message is sent. */
let mOpts = [], mSel = 0;
const MENTION_TOKEN = /(?:^|\s)@([\w.-]*)$/;

function closeMentions(){
  mOpts = []; mSel = 0;
  const menu = $("mentionMenu");
  menu.hidden = true; menu.innerHTML = "";
}
function onComposerInput(t){ autogrow(t); updateMentions(); }

function updateMentions(){
  const box = $("say"), menu = $("mentionMenu");
  const m = box.disabled ? null : MENTION_TOKEN.exec(box.value.slice(0, box.selectionStart));
  const q = m ? m[1].toLowerCase() : null;
  mOpts = (q === null || !snap) ? []
    : snap.participants.filter(p => p.name !== ME &&
        p.name.toLowerCase().startsWith(q)).slice(0, 8);
  if(!mOpts.length) return closeMentions();
  if(mSel >= mOpts.length) mSel = 0;
  menu.hidden = false;
  // Says whether each name is listening, because typing it does not wake it.
  menu.innerHTML = mOpts.map((p, i) => `
    <div class="opt" role="option" aria-selected="${i === mSel}"
         onmousedown="event.preventDefault();pickMention(${i})">
      <span class="dot ${p.online ? "idle" : "off"}"></span>
      <span class="grow">${esc(p.name)}</span>
      <span class="s">${p.online ? "listening" : "idle"}</span>
    </div>`).join("");
}

function pickMention(i){
  const box = $("say"), p = mOpts[i];
  if(!p) return;
  const upto = box.value.slice(0, box.selectionStart);
  const m = MENTION_TOKEN.exec(upto);
  if(!m) return closeMentions();
  const at = upto.length - m[1].length - 1;
  box.value = box.value.slice(0, at) + "@" + p.name + " "
            + box.value.slice(box.selectionStart);
  const caret = at + p.name.length + 2;
  closeMentions(); autogrow(box);
  box.focus(); box.setSelectionRange(caret, caret);
}

/* ============================ composing ============================ */
function autogrow(t){ t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
function onKey(e){
  if(mOpts.length){
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      mSel = (mSel + (e.key === "ArrowDown" ? 1 : mOpts.length - 1)) % mOpts.length;
      return updateMentions();
    }
    // Enter completes the name here rather than sending: the menu is open
    // because the chair is still writing who this is for.
    if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); return pickMention(mSel); }
    if(e.key === "Escape"){ e.preventDefault(); return closeMentions(); }
  }
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
}
const send = guard(async () => {
  const box = $("say"), text = box.value.trim();
  if(!text || !cur) return;
  if(!ensureName()) return;
  box.value = ""; autogrow(box); closeMentions();
  let r;
  try { r = await post(`/api/rooms/${cur}/post`, {name:ME, text}); }
  catch(err){ box.value = text; autogrow(box); throw err; }
  // The message is in the room either way. The toast is about the ringing that
  // did not happen — a mention of a session that is not reading reaches nobody
  // until it next looks, and saying nothing here would be the same false green
  // the Call button had.
  if(r && r.note) toast(r.note, null, "Mentioned, but not woken");
});

const addNote = guard(async () => {
  const box = $("noteBox"), text = box.value.trim();
  if(!text || !cur) return;
  box.value = "";
  await post(`/api/rooms/${cur}/note`, {name:ME, text});
});

/* ============================ chair controls ============================ */
const admin = (action, extra) =>
  post(`/api/rooms/${cur}/admin`, Object.assign({action, name:ME}, extra || {}));

const setMute = guard((who, on) => admin(on ? "mute" : "unmute", {target:who}));
const kick = guard(async who => {
  if(!confirm(`Remove ${who} from this meeting?\n\nIt can rejoin only if you call it back.`)) return;
  await admin("kick", {target:who});
});
const askSummary = guard(() => admin("ask_summary", {target:""})
  .then(() => toast("Asked the room for a summary.", "good")));
const localDigest = guard(async () => {
  const d = await api(`/api/rooms/${cur}/summary`);
  await post(`/api/rooms/${cur}/summary`, {name:ME, text:d.text});
});
const pruneGhosts = guard(async () => {
  const r = await admin("prune");
  toast(r.dropped.length ? `Dropped ${r.dropped.join(", ")}.`
                         : "No ghost seats to drop.", "good");
});
const toggleClosed = guard(() => admin(snap && snap.closed ? "reopen" : "close"));
const toggleArchived = guard(() => admin(snap && snap.archived ? "unarchive" : "archive"));
const deleteRoom = guard(async () => {
  if(!snap) return;
  if(!confirm(`Delete "${snap.title}" and its transcript?\n\n`
            + `This cannot be undone. Archive instead if you only want it out of the way.`)) return;
  await admin("delete");
  cur = null; snap = null;
  if(roomES) roomES.close();
  $("ttl").textContent = "No meeting open"; $("ag").textContent = "";
  $("log").innerHTML = ""; $("stat").hidden = true;
  $("say").disabled = $("btnSend").disabled = $("btnExport").disabled = true;
  toast("Meeting deleted.", "good");
});
const editAgenda = guard(async () => {
  if(!cur) return;
  const v = prompt("Agenda — the one question this meeting answers",
                   (snap && snap.agenda) || "");
  if(v === null) return;
  await admin("agenda", {text:v.trim()});
});
function exportRoom(){ if(cur) location.href = `/api/rooms/${cur}/export`; }

/* ============================ new meeting ============================ */
function openNewRoom(){
  const m = document.createElement("div");
  m.className = "mask";
  m.onclick = e => { if(e.target === m) m.remove(); };
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="New meeting">
    <h3>New meeting</h3>
    <p class="sub">One question per meeting works better than a topic.</p>
    <div class="field">
      <label for="nrTitle">Title</label>
      <input id="nrTitle" placeholder="Ship 0.2.2?" autocomplete="off">
    </div>
    <div class="field">
      <label for="nrAgenda">Agenda</label>
      <input id="nrAgenda" placeholder="Do we publish to PyPI now?" autocomplete="off">
      <div class="help">Participants are shown this when they are called in.</div>
    </div>
    <div class="field">
      <label for="nrMe">You are</label>
      <input id="nrMe" autocomplete="off">
      <div class="help">Your name in the transcript. Stored in this browser only.</div>
    </div>
    <div class="actions">
      <button onclick="this.closest('.mask').remove()">Cancel</button>
      <button class="p" id="nrGo">Create</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  const title = m.querySelector("#nrTitle");
  m.querySelector("#nrMe").value = (ME === "chair" ? "" : ME);
  title.focus();
  const go = guard(async () => {
    const t = title.value.trim();
    if(!t) return toast("A meeting needs a title.", "bad");
    const who = m.querySelector("#nrMe").value.trim();
    if(who){ ME = who; store.set("me", ME); paintMe(); }
    const room = await post("/api/rooms",
      {title:t, agenda:m.querySelector("#nrAgenda").value.trim(), name:ME});
    m.remove();
    openRoom(room.id);
  });
  m.querySelector("#nrGo").onclick = go;
  m.addEventListener("keydown", e => {
    if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); go(); }
  });
}

/* ============================ misc ============================ */
function togglePane(which){
  $(which === "right" ? "paneRight" : "paneLeft").classList.toggle("open");
}
/* An overlaid pane covers the app, and Escape is not a gesture a phone has: with
   nothing but the key to dismiss it, opening one is a trap. */
document.addEventListener("click", e => {
  // A modal owns the dismiss gesture while it is up, the same precedence Escape
  // gives it below — otherwise clicking into the New meeting dialog closes the
  // pane whose button opened it.
  if(document.querySelector(".mask")) return;
  // composedPath() is captured at dispatch, so it still names the pane after a
  // control inside one has replaced its container's innerHTML mid-click
  // (toggleArchive, toggleUnreachable). Walking up from e.target instead would
  // find a detached node with no ancestors and close the pane under the finger.
  // `.pane-btn` is a selector hook, never styled: the header buttons sit outside
  // the pane they open, so nothing else marks them as part of it.
  if(e.composedPath().some(n => n.classList &&
     (n.classList.contains("pane") || n.classList.contains("pane-btn")))) return;
  document.querySelectorAll(".pane.open").forEach(p => p.classList.remove("open"));
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    const m = document.querySelector(".mask");
    if(m) return m.remove();
    document.querySelectorAll(".pane.open").forEach(p => p.classList.remove("open"));
  }
  if(e.key === "n" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openNewRoom(); }
});

/* ============================ boot ============================ */
ME = store.get("me", "") || "chair";
seen = store.get("seen", {}) || {};
paintMe();
watchState();
// Reopen whatever was last open, once the first state arrives.
const last = store.get("lastRoom", null);
if(last){
  const once = () => { stateES.removeEventListener("state", once);
                       if(S.rooms.some(r => r.id === last)) openRoom(last); };
  setTimeout(() => { if(S.rooms.some(r => r.id === last)) openRoom(last); }, 400);
}
if(ME === "chair") setTimeout(askName, 300);
</script>
